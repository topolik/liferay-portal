apply plugin: "com.liferay.portal.tools.service.builder"

buildService {
	apiDir = "../keymanager-provider-db-api/src/main/java"
}

dependencies {
	compileOnly group: "biz.aQute.bnd", name: "biz.aQute.bndlib", version: "6.4.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.4.0"
	compileOnly group: "org.osgi", name: "org.osgi.service.metatype.annotations", version: "1.4.0"
	compileOnly project(":apps:keymanager:keymanager-api")
	compileOnly project(":apps:keymanager:keymanager-provider-db-api")
	compileOnly project(":apps:keymanager:keymanager-spi")
	compileOnly project(":apps:portal-configuration:portal-configuration-metatype-definitions-annotations")
	compileOnly project(":apps:portal:portal-aop-api")
	compileOnly project(":apps:static:portal-configuration:portal-configuration-metatype-api")
	compileOnly project(":core:petra:petra-io")
	compileOnly project(":core:petra:petra-lang")
	compileOnly project(":core:petra:petra-sql-dsl-api")
	compileOnly project(":core:petra:petra-sql-dsl-spi")
	compileOnly project(":core:petra:petra-string")

	testImplementation group: "com.liferay.portal", name: "com.liferay.portal.test", version: "default"
	testImplementation group: "junit", name: "junit", version: "4.13.1"
	testImplementation group: "org.mockito", name: "mockito-core", version: "4.4.0"
	testImplementation project(":apps:static:portal-configuration:portal-configuration-persistence-api")
}
