gcp-adc-access-token-secret-vault-provider-configuration-name=GCP ADC Access Token Identity Provider Configuration
gcp-adc-impersonation-access-token-secret-vault-provider-configuration-name=GCP ADC Impersonation Access Token Identity Provider Configuration
gcp-auth-key-reference=GCP Auth Key Reference
gcp-auth-key-reference-description=A KeyReference pointing to a GCP auth material JSON (Service Account key, or a dynamic token JSON). If empty, Application Default Credentials (ADC) will be used.
gcp-kms-crypto-vault-provider-configuration-name=GCP KMS Crypto Vault Provider Configuration
gcp-secret-manager-secret-vault-provider-configuration-name=GCP Secret Manager Secret Vault Provider Configuration
gcp-service-account-key-access-token-secret-vault-provider-configuration-name=GCP Service Account Key Access Token Identity Provider Configuration
key-ring-path=Key Ring Path
key-ring-path-description=The full resource name of the GCP KMS Key Ring (e.g. projects/[PROJECT]/locations/[LOCATION]/keyRings/[NAME]).
kms-key-name=KMS Key Name
kms-key-name-description=The full resource name of a Cloud KMS key used to encrypt the secret (CMEK). Example: projects/my-project/locations/global/keyRings/my-ring/cryptoKeys/my-key.
location-id=Location ID
location-id-description=The GCP location (e.g. global, us-central1).
locations-description=A list of GCP locations for User-Managed replication. If empty, Automatic replication is used.
new-key-protection-level=New Key Protection Level
new-key-protection-level-description=The protection level for newly generated keys (e.g. SOFTWARE, HSM). Existing keys are not affected.
new-key-rotation-period-seconds=New Key Rotation Period (Seconds)
new-key-rotation-period-seconds-description=The period in seconds after which newly generated keys are automatically rotated. Default is 90 days (7776000 seconds). Existing keys are not affected.
project-id=GCP Project ID
project-id-description=The GCP Project ID.
provider-id=Provider ID
provider-id-description=The unique identifier for this provider.
scopes=OAuth2 Scopes
scopes-description=The list of OAuth2 scopes to request for the access token (default: https://www.googleapis.com/auth/cloud-platform).
target-service-account=Target Service Account
target-service-account-description=The email address of the service account to impersonate. Base identity must have 'roles/iam.serviceAccountTokenCreator' role on this account.
token-lifetime-seconds=Token Lifetime (Seconds)
token-lifetime-seconds-description=The requested lifetime for the access token in seconds (default: 3600). Maximum value is usually 3600 (1 hour).